[project]
name = "d-arxiv-1st"
version = "0.2.1"
description = "Descarga, procesa e indexa publicaciones de Internet Archive para explotacion con IA"
requires-python = ">=3.11"
dependencies = [
  "requests>=2.31.0",
  "pyyaml>=6.0",
  "mcp>=1.0.0,<2.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-cov>=5.0.0",
  "build>=1.0.0",
  "setuptools>=68.0",
  "wheel>=0.40.0",
]

[project.scripts]
d-arxiv = "cli.main:main"
d-arxiv-mcp = "mcp_server.server:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["lib*", "cli*", "mcp_server*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not integration'"
markers = [
  "integration: hits the real archive.org API (network required)",
]
